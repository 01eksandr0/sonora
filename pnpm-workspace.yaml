packages:
  - apps/*
  - packages/*

autoInstallPeers: true
strictPeerDependencies: false

# pnpm 12: postinstall scripts are blocked unless explicitly allowed.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true
  vue-demi: true
  '@scarf/scarf': false

# Exact-pinned versions newer than pnpm's default minimumReleaseAge.
minimumReleaseAgeExclude:
  - '@nestjs/throttler@6.7.0'
  - '@primeuix/themes@3.0.1'
  - '@vue/compiler-core@3.5.43'
  - '@vue/compiler-dom@3.5.43'
  - '@vue/compiler-sfc@3.5.43'
  - '@vue/compiler-ssr@3.5.43'
  - '@vue/reactivity@3.5.43'
  - '@vue/runtime-core@3.5.43'
  - '@vue/runtime-dom@3.5.43'
  - '@vue/server-renderer@3.5.43'
  - '@vue/shared@3.5.43'
  - jsdom@30.1.0
  - vue@3.5.43
